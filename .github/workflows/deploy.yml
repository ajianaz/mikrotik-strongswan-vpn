name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    branches: [develop, main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || 'manual' }}
  cancel-in-progress: false

permissions:
  id-token: write  # Required for Infisical OIDC

jobs:
  deploy:
    name: Deploy (${{ github.event.workflow_run.head_branch || 'manual' }})
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Fetch shared secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: "6bd2b8d8-a9a3-4331-8b37-bf2764fc320b"
          project-slug: "github-actions"
          env-slug: "prod"
          domain: "https://infisical.ajianaz.dev"

      - name: Determine deploy path
        id: path
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "target=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
            echo "Deploying to PROD"
          else
            echo "target=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
            echo "Deploying to DEV"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            cd ${{ steps.path.outputs.target }}

            echo "=== Pulling latest code ==="
            git pull

            echo "=== Pulling latest images ==="
            docker compose pull

            echo "=== Restarting services ==="
            docker compose up -d --remove-orphans --force-recreate

            echo "=== Waiting for containers ==="
            sleep 10

            echo "=== Container status ==="
            docker compose ps

            echo "=== vpn-server logs ==="
            docker logs vpn-server 2>&1 | tail -30 || true

            echo "=== DEBUG: inspect container filesystem ==="
            docker compose exec vpn-server sh -c '
                echo "--- /etc/strongswan.d/ listing ---"
                ls -la /etc/strongswan.d/ 2>/dev/null || echo "NOT FOUND"
                echo "--- /etc/strongswan.d/charon/ listing ---"
                ls -la /etc/strongswan.d/charon/ 2>/dev/null || echo "NOT FOUND"
                echo "--- sha1.conf ---"
                cat /etc/strongswan.d/charon/sha1.conf 2>/dev/null || echo "NOT FOUND"
                echo "--- nonce.conf ---"
                cat /etc/strongswan.d/charon/nonce.conf 2>/dev/null || echo "NOT FOUND"
                echo "--- Plugin .so files ---"
                ls /usr/lib/ipsec/plugins/ 2>/dev/null || echo "NOT FOUND"
                echo "--- libstrongswan.so ---"
                ls -la /usr/lib/ipsec/libstrongswan.so* 2>/dev/null || echo "NOT FOUND"
                echo "--- charon binary ---"
                file /usr/local/bin/charon
                echo "--- ldd charon ---"
                ldd /usr/local/bin/charon 2>/dev/null | head -10
                echo "--- /etc/strongswan.conf ---"
                cat /etc/strongswan.conf
            ' 2>&1 || echo "Container not running, trying docker run..."
            if ! docker compose exec vpn-server true 2>/dev/null; then
                echo "--- Container not running, inspecting image directly ---"
                docker compose pull vpn-server 2>/dev/null
                docker run --rm ghcr.io/ajianaz/mikrotik-strongswan-vpn/vpn-server:develop sh -c '
                    echo "--- /etc/strongswan.d/charon/ ---"
                    ls -la /etc/strongswan.d/charon/ 2>/dev/null || echo "NOT FOUND"
                    echo "--- sha1.conf ---"
                    cat /etc/strongswan.d/charon/sha1.conf 2>/dev/null || echo "NOT FOUND"
                    echo "--- plugins ---"
                    ls /usr/lib/ipsec/plugins/libstrongswan-sha1* /usr/lib/ipsec/plugins/libstrongswan-nonce* /usr/lib/ipsec/plugins/libstrongswan-random* 2>/dev/null || echo "NOT FOUND"
                    echo "--- ldconfig ---"
                    ldconfig -p 2>/dev/null | grep strongswan | head -10
                ' 2>&1
            fi

            echo "=== Deploy complete ==="
