name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  id-token: write  # Required for Infisical OIDC

jobs:
  deploy:
    name: Deploy to OCI server
    runs-on: ubuntu-latest
    environment: OCI
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: "6bd2b8d8-a9a3-4331-8b37-bf2764fc320b"
          project-slug: "github-actions"
          env-slug: "prod"
          infra-url: "https://infisical.ajianaz.dev"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== Pulling latest images ==="
            docker compose pull

            echo "=== Restarting services ==="
            docker compose up -d --remove-orphans

            echo "=== Waiting for containers ==="
            sleep 10

            echo "=== Container status ==="
            docker compose ps

            echo "=== Deploy complete ==="
