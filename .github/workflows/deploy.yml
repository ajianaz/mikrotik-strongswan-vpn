name: Deploy to Server

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop, main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - dev
          - prod

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write  # Required for Infisical OIDC
  actions: read    # Required for workflow_run

jobs:
  deploy:
    name: Deploy (${{ github.event.workflow_run.head_branch || github.ref_name }})
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Fetch shared secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: "6bd2b8d8-a9a3-4331-8b37-bf2764fc320b"
          project-slug: "github-actions"
          env-slug: "prod"
          domain: "https://infisical.ajianaz.dev"

      - name: Determine deploy target
        id: target
        run: |
          # Priority: manual input > workflow_run branch > default
          MANUAL="${{ github.event.inputs.environment }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          if [ "$MANUAL" != "auto" ] && [ -n "$MANUAL" ]; then
            BRANCH="$MANUAL"
          fi

          # Fallback for workflow_dispatch without branch context
          if [ -z "$BRANCH" ]; then
            BRANCH="develop"
          fi

          if [ "$BRANCH" = "main" ]; then
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "target=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
            echo "Deploying to PROD"
          else
            echo "branch=develop" >> $GITHUB_OUTPUT
            echo "target=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
            echo "Deploying to DEV"
          fi

      - name: Deploy & Verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 10m
          script: |
            cd ${{ steps.target.outputs.target }}

            echo "========================================"
            echo " DEPLOY: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo " Branch: ${{ steps.target.outputs.branch }}"
            echo "========================================"

            # ── 1. Pull code + images ──────────────────
            echo ""
            echo ">>> [1/4] Pulling latest code + images..."
            git fetch origin
            git checkout ${{ steps.target.outputs.branch }}
            git pull --ff-only
            docker compose pull 2>&1 | grep -E "Pulled|Error|digest" || true

            # ── 2. Deploy ──────────────────────────────
            echo ""
            echo ">>> [2/4] Restarting services..."
            docker compose up -d --remove-orphans --force-recreate 2>&1 | grep -v "Already exists" | grep -v "^$" || true

            # ── 3. Health check polling (compact) ──────
            echo ""
            echo ">>> [3/4] Waiting for services..."
            for i in $(seq 1 9); do
              sleep 10
              VPN_H=$(docker inspect --format='{{.State.Health.Status}}' vpn-server 2>/dev/null || echo "missing")
              MGR_H=$(docker inspect --format='{{.State.Health.Status}}' vpn-manager 2>/dev/null || echo "missing")
              echo "  [${i}0s] vpn-server=$VPN_H vpn-manager=$MGR_H"
              if [ "$VPN_H" = "healthy" ] && [ "$MGR_H" = "healthy" ]; then
                echo "  ✅ All healthy"
                break
              fi
            done

            # ── 4. Verify ──────────────────────────────
            echo ""
            echo ">>> [4/4] Verification..."
            FAIL=0

            for svc in vpn-server vpn-manager vpn-db; do
              STATE=$(docker inspect --format='{{.State.Status}}' $svc 2>/dev/null || echo "missing")
              if [ "$STATE" != "running" ]; then
                echo "  ❌ $svc: $STATE"
                FAIL=1
              else
                echo "  ✅ $svc: running"
              fi
            done

            # Check L2TP config + xl2tpd
            CONN_COUNT=$(docker exec vpn-server swanctl --list-conns 2>/dev/null | grep -c "^[^ ]" || echo "0")
            CONN_COUNT=$(echo "$CONN_COUNT" | tr -d '[:space:]')
            L2TP_CONN=$(docker exec vpn-server swanctl --list-conns 2>/dev/null | grep -c "l2tp-transport" || echo "0")
            L2TP_CONN=$(echo "$L2TP_CONN" | tr -d '[:space:]')
            L2TP_PROC=$(docker exec vpn-server pgrep -c xl2tpd 2>/dev/null || echo "0")
            L2TP_PROC=$(echo "$L2TP_PROC" | tr -d '[:space:]')

            echo "  📊 Connections: $CONN_COUNT loaded | L2TP transport: $L2TP_CONN | xl2tpd: $L2TP_PROC"

            # Check API healthz (default port 8080)
            MGR_PORT=$(docker inspect --format='{{.Config.Env}}' vpn-manager 2>/dev/null | tr ' ' '\n' | grep LISTEN | head -1 | cut -d= -f2 | tr -d ':')
            MGR_PORT="${MGR_PORT:-8080}"
            if docker exec vpn-manager wget -q -O /dev/null "http://localhost:${MGR_PORT}/healthz" 2>/dev/null; then
              echo "  ✅ API /healthz: 200"
            else
              echo "  ❌ API /healthz: unreachable (port ${MGR_PORT})"
              FAIL=1
            fi

            # Show errors only (not full logs — too noisy)
            VPN_ERR=$(docker logs vpn-server 2>&1 | grep -iE "SIGSEGV|segfault|aborting|initialization failed" | grep -vi "eap-mschapv2" || true)
            if [ -n "$VPN_ERR" ]; then
              echo "  ❌ vpn-server errors:"
              echo "$VPN_ERR" | head -5
              FAIL=1
            fi

            MGR_ERR=$(docker logs vpn-manager 2>&1 | grep -iE "FATAL|panic" || true)
            if [ -n "$MGR_ERR" ]; then
              echo "  ❌ vpn-manager fatal errors:"
              echo "$MGR_ERR" | head -5
              FAIL=1
            fi

            # ── Verdict ────────────────────────────────
            echo ""
            if [ "$FAIL" -eq 0 ]; then
              echo "========================================="
              echo " ✅ DEPLOY SUCCESSFUL"
              echo "========================================="
            else
              echo "========================================="
              echo " ❌ DEPLOY HAS ISSUES — see above"
              echo "========================================="
              exit 1
            fi
