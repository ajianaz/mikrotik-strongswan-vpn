name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    branches: [develop, main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || 'manual' }}
  cancel-in-progress: false

permissions:
  id-token: write  # Required for Infisical OIDC

jobs:
  deploy:
    name: Deploy (${{ github.event.workflow_run.head_branch || 'manual' }})
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Fetch shared secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: "6bd2b8d8-a9a3-4331-8b37-bf2764fc320b"
          project-slug: "github-actions"
          env-slug: "prod"
          domain: "https://infisical.ajianaz.dev"

      - name: Determine deploy path
        id: path
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "target=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
            echo "Deploying to PROD"
          else
            echo "target=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
            echo "Deploying to DEV"
          fi

      - name: Deploy & Verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            cd ${{ steps.path.outputs.target }}

            echo "========================================"
            echo " DEPLOY: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "========================================"

            # ── 1. Pull code + images ──────────────────
            echo ""
            echo ">>> [1/5] Pulling latest code + images..."
            git pull
            docker compose pull

            # Ensure LISTEN_PORT is in .env (extract from LISTEN if missing)
            if ! grep -q '^LISTEN_PORT=' .env 2>/dev/null; then
              LISTEN_VAL=$(grep '^LISTEN=' .env 2>/dev/null | head -1 | cut -d= -f2)
              if [[ -n "$LISTEN_VAL" ]]; then
                PORT="${LISTEN_VAL#:}"
                echo "LISTEN_PORT=${PORT}" >> .env
                echo "  Auto-added LISTEN_PORT=${PORT} to .env"
              fi
            fi
            echo "  .env LISTEN_PORT=$(grep '^LISTEN_PORT=' .env 2>/dev/null | cut -d= -f2)"
            echo "  .env LISTEN=$(grep '^LISTEN=' .env 2>/dev/null | cut -d= -f2)"

            # ── 2. Deploy ──────────────────────────────
            echo ""
            echo ">>> [2/5] Restarting services..."
            docker compose up -d --remove-orphans --force-recreate

            # Debug: show actual healthcheck config
            echo "  vpn-manager healthcheck:"
            docker inspect vpn-manager --format='{{.Config.Healthcheck.Test}}' 2>/dev/null || true

            # ── 3. Health check polling loop ───────────
            echo ""
            echo ">>> [3/5] Health check (polling up to 90s)..."
            MAX_WAIT=90
            INTERVAL=10
            ELAPSED=0
            VPN_OK=false
            MGR_OK=false

            while [ $ELAPSED -lt $MAX_WAIT ]; do
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))

              # Check vpn-server health
              VPN_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' vpn-server 2>/dev/null || echo "missing")
              if [ "$VPN_HEALTH" = "healthy" ]; then
                VPN_OK=true
              fi

              # Check vpn-manager health
              MGR_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' vpn-manager 2>/dev/null || echo "missing")
              if [ "$MGR_HEALTH" = "healthy" ]; then
                MGR_OK=true
              fi

              STATUS_LINE="[${ELAPSED}s] vpn-server=${VPN_HEALTH:-N/A} vpn-manager=${MGR_HEALTH:-N/A}"
              echo "  $STATUS_LINE"

              if $VPN_OK && $MGR_OK; then
                echo "  ✅ All services healthy at ${ELAPSED}s"
                break
              fi
            done

            # ── 4. Collect logs ────────────────────────
            echo ""
            echo ">>> [4/5] Collecting logs..."

            echo ""
            echo "=== Container Status ==="
            docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "=== vpn-server (first 30 lines = init) ==="
            docker logs vpn-server 2>&1 | head -30 || true

            echo ""
            echo "=== vpn-server (last 15 lines = crash) ==="
            docker logs vpn-server 2>&1 | tail -15 || true

            echo ""
            echo "=== vpn-manager (last 10 lines) ==="
            docker logs vpn-manager 2>&1 | tail -10 || true

            # ── 5. Log analysis + verdict ──────────────
            echo ""
            echo ">>> [5/5] Log analysis..."

            # Give vpn-manager a few seconds to finish startup
            sleep 5

            FAIL=0

            # Check container running state
            for svc in vpn-server vpn-manager vpn-db; do
              STATE=$(docker inspect --format='{{.State.Status}}' $svc 2>/dev/null || echo "missing")
              if [ "$STATE" != "running" ]; then
                echo "  ❌ $svc: $STATE"
                FAIL=1
              else
                echo "  ✅ $svc: running"
              fi
            done

            # Scan vpn-server logs for known error patterns
            VPN_LOGS=$(docker logs vpn-server 2>&1 || true)
            ERROR_PATTERNS="SIGSEGV|segfault|aborting|initialization failed|charon.*failed"
            for pat in $ERROR_PATTERNS; do
              if echo "$VPN_LOGS" | grep -qi "$pat" | grep -qvi "eap-mschapv2"; then
                echo "  ❌ vpn-server log: matched '$pat'"
                FAIL=1
              fi
            done

            # Scan vpn-manager logs for errors
            MGR_LOGS=$(docker logs vpn-manager 2>&1 || true)
            if echo "$MGR_LOGS" | grep -qi "fatal\|panic\|listen.*error\|database.*error"; then
              echo "  ❌ vpn-manager log: error detected"
              FAIL=1
            fi

            # Check strongSwan loaded connections (informational — 0 is OK if no config yet)
            SAS_COUNT=$(docker exec vpn-server swanctl --list-sas 2>/dev/null | grep -c "^[^ ]" || echo "0")
            CONN_COUNT=$(docker exec vpn-server swanctl --list-conns 2>/dev/null | grep -c "^[^ ]" || echo "0")
            echo "  📊 Connections: $CONN_COUNT loaded, $SAS_COUNT active SAs"

            # Check EAP-MSCHAPv2 plugin availability
            EAP_CHECK=$(docker exec vpn-server swanctl --list-plugins 2>/dev/null | grep -c "eap-mschapv2" || echo "0")
            if [ "$EAP_CHECK" -ge 1 ]; then
              echo "  ✅ EAP-MSCHAPv2 plugin loaded"
            fi

            # Check xl2tpd (if running inside container)
            L2TP_CHECK=$(docker exec vpn-server pgrep -c xl2tpd 2>/dev/null || echo "0")
            if [ "$L2TP_CHECK" -ge 1 ]; then
              echo "  ✅ xl2tpd running"
            fi

            # Check API healthz via docker exec (bypasses port mapping)
            # Find the actual listening port from container (Alpine has netstat in busybox)
            MGR_PORT=$(docker exec vpn-manager netstat -tlnp 2>/dev/null | grep 'LISTEN' | awk '{print $4}' | rev | cut -d: -f1 | rev | head -1)
            MGR_PORT=${MGR_PORT:-8080}
            if docker exec vpn-manager wget -q -O /dev/null "http://localhost:${MGR_PORT}/healthz" 2>/dev/null; then
              echo "  ✅ API /healthz: 200 (via docker exec)"
            else
              echo "  ❌ API /healthz: unreachable"
              FAIL=1
            fi

            # ── Verdict ────────────────────────────────
            echo ""
            if [ $FAIL -eq 0 ]; then
              echo "========================================="
              echo " ✅ DEPLOY SUCCESSFUL"
              echo " All services running, no errors detected"
              echo "========================================="
            else
              echo "========================================="
              echo " ❌ DEPLOY HAS ISSUES"
              echo " Check errors above"
              echo "========================================="
              exit 1
            fi
