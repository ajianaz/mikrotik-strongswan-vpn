# swanctl.conf — strongSwan swanctl configuration loader
# Mount: ./config/swanctl.conf → /etc/swanctl/swanctl.conf
#
# This file tells charon where to find connection configs and secrets.

swanctl {
  load = {
    # Load all connection configs from conf.d/
    confd_dir = /etc/swanctl/conf.d
    
    # Load secrets (PSK, certificates)
    secrets_file = /etc/swanctl/secret
  }
}
