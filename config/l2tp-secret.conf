# l2tp-secret.conf — L2TP/IPSec transport mode PSK
# Default PSK for all L2TP clients. Override via L2TP_PSK env var in vpn-manager.
# This file is appended to /etc/swanctl/secret on container start.
#
# Mount: ./config/l2tp-secret.conf → /etc/swanctl/conf.d/l2tp-secret.conf
# (entrypoint.sh copies the PSK entry into /etc/swanctl/secret)

%any %any : PSK "vpn-l2tp-psk"
