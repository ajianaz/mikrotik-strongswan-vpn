# L2TP/IPsec Pre-Shared Key
# Used for IKEv1 Phase 1 authentication in transport mode
# This file is mounted into vpn-server and bootstrapped into swanctl secret
#
# IMPORTANT: Change this default PSK in production!
# Set L2TP_PSK environment variable to override

# L2TP transport mode — accepts any remote
%any %any : PSK "vpn-l2tp-psk"
