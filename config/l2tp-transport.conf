# IKEv1 Transport Mode for L2TP/IPsec
# Wraps UDP 1701 (L2TP) in IPsec transport mode
# Compatible with RouterOS 6.x (IKEv1 only) and 7.x
#
# strongSwan loads this from /etc/swanctl/conf.d/

l2tp-transport {
    version = 1
    proposals = aes128-sha1-modp1024,aes128-sha1-modp2048,aes256-sha1-modp1024,aes256-sha1-modp2048
    rekey_time = 3600s
    dpd_delay = 30s
    dpd_timeout = 120s

    local_addrs = %any

    remote_addrs = %any

    local {
        auth = psk
    }
    remote {
        auth = psk
    }

    children {
        l2tp {
            esp_proposals = aes128-sha1-modp1024,aes128-sha1-modp2048,aes256-sha1-modp1024,aes256-sha1-modp2048
            dpd_action = clear
            close_action = none
            mode = transport
        }
    }
}
