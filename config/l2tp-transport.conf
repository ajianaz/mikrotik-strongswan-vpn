# l2tp-transport.conf — IKEv1 transport mode for L2TP/IPSec
# This is the STATIC base L2TP config. All L2TP clients share the same PSK.
# vpn-manager writes per-tunnel PPP credentials (chap-secrets) but NOT per-tunnel IPSec config.
#
# Mount: ./config/l2tp-transport.conf → /etc/swanctl/conf.d/l2tp-transport.conf

connections {
    l2tp-transport {
        version = 1
        type = transport
        local_addrs = %any
        remote_addrs = %any

        proposals = aes128-sha1-modp1024,aes256-sha1-modp2048,aes128-sha256-modp1024

        local {
            auth = psk
        }
        remote {
            auth = psk
        }
    }
}
