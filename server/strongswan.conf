# strongSwan daemon configuration
# Mount: ./server/strongswan.conf → /etc/strongswan.conf (read-only)
#
# This file is SAFE to commit — no secrets.
#
# ARM Ubuntu 24.04: load_modular=no prevents segfault from extra plugins.
# Explicitly list only required plugins.

charon {
    load_modular = no

    plugins {
        kernel-netlink {
            load = yes
        }
        socket-default {
            load = yes
        }
        stroke {
            load = yes
        }
        swanctl {
            load = yes
        }
    }

    filelog {
        stdout {
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            append = no
            default = 4
        }
    }
}
