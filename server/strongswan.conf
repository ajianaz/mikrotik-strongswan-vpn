# strongSwan daemon configuration
# Mount: ./server/strongswan.conf → /etc/strongswan.conf (read-only)
#
# This file is SAFE to commit — no secrets.
#
# ARM Ubuntu 24.04: load_modular=no is IGNORED by charon.
# Instead, unwanted plugin .so files are removed at build time (Dockerfile).

charon {
    filelog {
        stdout {
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            append = no
            default = 2
        }
    }
}
