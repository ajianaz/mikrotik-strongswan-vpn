# strongSwan daemon configuration
# Mount: ./server/strongswan.conf → /etc/strongswan.conf (read-only)
#
# This file is SAFE to commit — no secrets.
#
# ARM Ubuntu 24.04: load_modular=no is IGNORED by charon.
# Instead, unwanted plugin .so files are removed at build time (Dockerfile).

charon {
    # ARM Ubuntu 24.04: Without this, charon tries to dlopen() all known plugins
    # (50+), generating noisy "failed to load" warnings for missing ones.
    # Combined with the Dockerfile whitelist (removes unwanted .so files),
    # this keeps the log clean.
    load_modular = no

    filelog {
        stdout {
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            append = no
            default = 2
        }
    }
}
