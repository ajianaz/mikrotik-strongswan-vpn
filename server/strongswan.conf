# strongSwan daemon configuration
# Mount: ./server/strongswan.conf → /etc/strongswan.conf
#
# This file is SAFE to commit — no secrets.
#
# ARM Ubuntu 24.04: strongSwan uses /usr/lib/ipsec/ for binaries and plugins.
# Plugin auto-discovery (load_modular=yes) fails because plugin directory
# isn't in the default search path. We explicitly list required plugins.

charon {
    load_modular = no
    plugins {
        load = aes sha1 sha256 sha384 sha512 random nonce hmac mgf1 pubkey pkcs1 x509 kernel-netlink socket-default vici
    }

    filelog {
        stdout {
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            append = no
            default = 3
        }
    }
}
