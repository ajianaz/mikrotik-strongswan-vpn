# strongSwan daemon configuration
# Mount: ./server/strongswan.conf → /etc/strongswan.conf
#
# This file is SAFE to commit — no secrets.
#
# IMPORTANT: include /etc/strongswan.d/ to load plugin configs (sha1, nonce,
# random, etc.). Without this, charon fails with "unmet dependency: HASH_SHA1".
include /etc/strongswan.d/*.conf

charon {
    load_modular = yes
    plugins {
        load_all = yes
    }

    filelog {
        stdout {
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            append = no
            default = 3
        }
    }
}
