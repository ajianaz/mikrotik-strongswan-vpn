# strongSwan daemon configuration
# Mount: ./server/strongswan.conf → /etc/strongswan.conf
#
# This file is SAFE to commit — no secrets.
#
# Log level: configurable via STRONGSWAN_LOGLEVEL env var (docker-compose.yml)
# Levels: 0=none, 1=audit, 2=control, 3=control+more, 4=raw, 5=private

charon {
    load_modular = yes

    filelog {
        stdout {
            time_format = %Y-%m-%dT%H:%M:%S
            ike_name = yes
            append = no
            default = 3
        }
    }
}
