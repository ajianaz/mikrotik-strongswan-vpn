# =============================================================================
# strongSwan IKEv2 VPN Server + VPN Manager API + PostgreSQL — Docker Compose
# =============================================================================
#
# CRYPTO SUITE:
#   IKE:      aes256-sha256-ecp384  (ECDH with P-384)
#   ESP:      aes256-sha256-ecp384  (AES-256-CBC + HMAC-SHA2-256 + DH ECP384)
#   Auth:     EAP-MSCHAPv2 + L2TP (credentials via API)
#   Version:  IKEv2 ONLY
#
# COMPATIBILITY: RouterOS 6.49.x AND 7.x
#
# WHY network_mode: host?
#   Docker cannot proxy IP protocol 50 (ESP). Host networking is required
#   for native ESP traffic. NAT-T (UDP 4500) works as fallback behind NAT.
#
# FIREWALL (Oracle Cloud / iptables):
#   • UDP 500   — IKE (key exchange)
#   • UDP 4500  — NAT-T (ESP-in-UDP for NAT traversal)
#   • Protocol 50 — ESP (native encrypted data channel)
# =============================================================================

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vpn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpnuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vpnmgr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vpn-strongswan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpnuser} -d ${POSTGRES_DB:-vpnmgr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── strongSwan VPN Server ──────────────────────────────────────────────
  vpn-server:
    image: ghcr.io/ajianaz/mikrotik-strongswan-vpn/vpn-server:develop
    container_name: vpn-server
    restart: unless-stopped

    # CRITICAL: host network for ESP (protocol 50)
    network_mode: host

    cap_add:
      - NET_ADMIN

    environment:
      - STRONGSWAN_LOGLEVEL=${STRONGSWAN_LOGLEVEL:-3}
      - API_KEY=${API_KEY}

    volumes:
      # Shared swanctl config — vpn-manager writes here, vpn-server reads here
      - vpn-configs:/etc/swanctl
      # Shared PPP config — vpn-manager writes chap-secrets, vpn-server reads for xl2tpd
      - vpn-ppp:/etc/ppp

    healthcheck:
      test: ["CMD-SHELL", "swanctl --stats 2>/dev/null | grep -q 'loaded' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── VPN Manager API ────────────────────────────────────────────────────
  vpn-manager:
    image: ghcr.io/ajianaz/mikrotik-strongswan-vpn/vpn-manager:develop
    container_name: vpn-manager
    restart: unless-stopped

    volumes:
      # Same shared volume as vpn-server — writes swanctl configs here
      - vpn-configs:/etc/swanctl
      # Shared PPP config — writes L2TP chap-secrets for xl2tpd
      - vpn-ppp:/etc/ppp

      # SECURITY NOTE (#54): Mounting the Docker socket (even read-only) exposes
      # container metadata to the vpn-manager API process. For multi-tenant
      # deployments, replace with Tecnativa/docker-socket-proxy to restrict
      # allowed Docker API calls. For single-tenant (one VPN manager per host)
      # this is acceptable — the API is behind Bearer auth + rate limiting.
      # See: https://github.com/Tecnativa/docker-socket-proxy
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      - DB_URL=postgres://${POSTGRES_USER:-vpnuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpnmgr}?sslmode=disable
      - API_KEY=${API_KEY}
      - LISTEN=${LISTEN:-:8080}
      - VPN_CONTAINER=vpn-server
      - VPN_CONFIG_DIR=/etc/swanctl/conf.d
      - VPN_SECRET_FILE=/etc/swanctl/secret
      - VPN_LOCAL_IP=${VPN_LOCAL_IP:-10.10.10.1}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}

    ports:
      - "${LISTEN:-8080}"

    networks:
      - hermes-net
      - vpn-strongswan

    depends_on:
      postgres:
        condition: service_healthy
      vpn-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "PORT=$${LISTEN:-:8080}; PORT=$${PORT#:}; wget -q -O /dev/null http://localhost:$$PORT/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hermes-net:
    external: true
  vpn-strongswan:
    driver: bridge

volumes:
  vpn-configs:
  vpn-ppp:
  postgres-data:
