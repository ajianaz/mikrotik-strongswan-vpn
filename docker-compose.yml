# =============================================================================
# strongSwan IKEv2 VPN Server + VPN Manager API — Docker Compose
# =============================================================================
#
# CRYPTO SUITE:
#   IKE:      aes256-sha256-ecp384  (ECDH with P-384)
#   ESP:      aes256-sha256-ecp384  (AES-256-CBC + HMAC-SHA2-256 + DH ECP384)
#   Auth:     PSK (pre-shared key)
#   Version:  IKEv2 ONLY
#
# COMPATIBILITY: RouterOS 6.49.x AND 7.x
#
# WHY network_mode: host?
#   Docker cannot proxy IP protocol 50 (ESP). Host networking is required
#   for native ESP traffic. NAT-T (UDP 4500) works as fallback behind NAT.
#
# FIREWALL (Oracle Cloud / iptables):
#   • UDP 500   — IKE (key exchange)
#   • UDP 4500  — NAT-T (ESP-in-UDP for NAT traversal)
#   • Protocol 50 — ESP (native encrypted data channel)
#
# =============================================================================

# docker-compose.yml — MikroTik strongSwan VPN
version: "3.8"

services:
  vpn-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vpn-server
    restart: unless-stopped

    # CRITICAL: host network for ESP (protocol 50)
    network_mode: host

    cap_add:
      - NET_ADMIN

    volumes:
      # Shared swanctl config — vpn-manager writes here, vpn-server reads here
      - vpn-configs:/etc/swanctl
      # strongswan.conf copied during build, mount for runtime overrides
      - ./server/strongswan.conf:/etc/strongswan.conf:ro

    environment:
      - STRONGSWAN_LOGLEVEL=${STRONGSWAN_LOGLEVEL:-3}

    healthcheck:
      test: ["CMD-SHELL", "swanctl --stats 2>/dev/null | grep -q 'loaded' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  vpn-manager:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vpn-manager
    restart: unless-stopped

    volumes:
      # Same shared volume as vpn-server — writes swanctl configs here
      - vpn-configs:/etc/swanctl
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      - DB_URL=${DB_URL}
      - API_KEY=${API_KEY}
      - LISTEN=${LISTEN:-:8080}
      - VPN_CONTAINER=vpn-server
      - VPN_CONFIG_DIR=/etc/swanctl/conf.d
      - VPN_SECRET_FILE=/etc/swanctl/secret

    ports:
      - "${LISTEN:-8080}"

    depends_on:
      vpn-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vpn-configs:
