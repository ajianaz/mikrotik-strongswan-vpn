# =============================================================================
# strongSwan IKEv2 VPN Server + VPN Manager API + PostgreSQL — Docker Compose
# =============================================================================
#
# CRYPTO SUITE:
#   IKE:      aes256-sha256-ecp384  (ECDH with P-384)
#   ESP:      aes256-sha256-ecp384  (AES-256-CBC + HMAC-SHA2-256 + DH ECP384)
#   Auth:     PSK (pre-shared key)
#   Version:  IKEv2 ONLY
#
# COMPATIBILITY: RouterOS 6.49.x AND 7.x
#
# WHY network_mode: host?
#   Docker cannot proxy IP protocol 50 (ESP). Host networking is required
#   for native ESP traffic. NAT-T (UDP 4500) works as fallback behind NAT.
#
# FIREWALL (Oracle Cloud / iptables):
#   • UDP 500   — IKE (key exchange)
#   • UDP 4500  — NAT-T (ESP-in-UDP for NAT traversal)
#   • Protocol 50 — ESP (native encrypted data channel)
#
# =============================================================================

# docker-compose.yml — MikroTik strongSwan VPN
version: "3.8"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vpn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpnuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vpnmgr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpnuser} -d ${POSTGRES_DB:-vpnmgr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── strongSwan VPN Server ──────────────────────────────────────────────
  vpn-server:
    image: ghcr.io/ajianaz/mikrotik-strongswan-vpn/vpn-server:develop
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vpn-server
    restart: unless-stopped

    # CRITICAL: host network for ESP (protocol 50)
    network_mode: host

    cap_add:
      - NET_ADMIN

    volumes:
      # Shared swanctl config — vpn-manager writes here, vpn-server reads here
      - vpn-configs:/etc/swanctl
      # NOTE: strongswan.conf is copied into the image at build time (see server/Dockerfile)
      # No host mount needed — avoids "file not found" on fresh deploys

    environment:
      - STRONGSWAN_LOGLEVEL=${STRONGSWAN_LOGLEVEL:-3}

    # healthcheck disabled temporarily for debugging
    # healthcheck:
    #   test: ["CMD-SHELL", "swanctl --stats 2>/dev/null | grep -q 'loaded' || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

  # ── VPN Manager API ────────────────────────────────────────────────────
  vpn-manager:
    image: ghcr.io/ajianaz/mikrotik-strongswan-vpn/vpn-manager:develop
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vpn-manager
    restart: unless-stopped

    volumes:
      # Same shared volume as vpn-server — writes swanctl configs here
      - vpn-configs:/etc/swanctl
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      - DB_URL=postgres://${POSTGRES_USER:-vpnuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpnmgr}?sslmode=disable
      - API_KEY=${API_KEY}
      - LISTEN=${LISTEN:-:8080}
      - VPN_CONTAINER=vpn-server
      - VPN_CONFIG_DIR=/etc/swanctl/conf.d
      - VPN_SECRET_FILE=/etc/swanctl/secret

    ports:
      - "${LISTEN:-8080}"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vpn-configs:
  postgres-data:
